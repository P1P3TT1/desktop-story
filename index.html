<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop - Sarah's Computer</title>
    <link rel="stylesheet" href="css/desktop.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <!-- Icons, windows and their content are built by js/main.js from the files in content/ -->
    <main class="desktop" id="desktop" aria-label="Desktop"></main>

    <nav class="start-menu" id="start-menu" aria-label="Start menu" hidden></nav>

    <footer class="taskbar">
        <button class="start-button" id="start-button" aria-haspopup="true" aria-expanded="false">Start</button>
        <div class="task-buttons" id="task-buttons"></div>
        <div class="clock" id="clock"></div>
    </footer>

    <script>
        // Browsers block module scripts and content files on file://, so explain how to open the story instead.
        if (location.protocol === 'file:') {
            document.body.insertAdjacentHTML('beforeend', `
                <div class="boot-error">
                    <h2>This story needs to be opened through a web server</h2>
                    <p>The story's content lives in separate files, and browsers don't let a page opened
                    straight from disk load other files.</p>
                    <p>Run <code>node tools/serve.mjs</code> in the project folder and open
                    <a href="http://localhost:8000">http://localhost:8000</a>, or view the published GitHub Pages site.</p>
                </div>`);
        }
    </script>

    <noscript>
        <p style="position: fixed; top: 40%; width: 100%; text-align: center; color: white;">
            This story needs JavaScript to run.
        </p>
    </noscript>
</body>
</html>
